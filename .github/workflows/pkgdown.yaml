name: pkgdown

# Builds the pkgdown documentation site (_pkgdown.yml) and, on pushes to main,
# publishes it to GitHub Pages via the official GitHub Actions Pages pipeline
# (upload-pages-artifact -> deploy-pages). The built HTML in docs/ is served
# verbatim — GitHub's Jekyll processor is NOT involved — so there is no gh-pages
# branch to manage and nothing re-processes pkgdown's output.
#
# The site includes the reference index plus the K562 chr22 tutorial at
# vignettes/articles/ivea-k562.Rmd, which pkgdown renders LIVE from the source
# tree: it runs the real variational-Bayes inference against the committed
# example/output/ fixtures and reference/ files. Those live outside the package
# tarball (they are .Rbuildignore'd), so the site must be built from the
# checked-out source, not an installed tarball — which pkgdown does.
#
# This is an R-only build (library(IVEA) + library(ggplot2)); unlike pipeline.yml
# it needs none of the Python/MACS3/samtools stack, so it uses the same
# r-lib/actions + public RSPM toolchain as r-check.yml rather than the conda env.
# `local::.` installs IVEA so the article can load it; `needs: website` pulls the
# Suggests pkgdown requires (knitr, rmarkdown, ggplot2).
#
# ONE-TIME MAINTAINER ACTION: set Settings -> Pages -> Build and deployment ->
# Source to "GitHub Actions" (NOT "Deploy from a branch"). With the old
# branch-based setting GitHub runs Jekyll over the deployed files and fails;
# "GitHub Actions" serves the artifact this workflow uploads. Until that is set,
# the build job still runs and validates the site on every push/PR.

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# Allow one concurrent Pages deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # the tutorial article runs the chr22 inference live (~2 min)
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
            local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  # Publish only for the canonical history, never for PR previews.
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write        # publish to GitHub Pages
      id-token: write     # OIDC token the deploy-pages action verifies
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4
