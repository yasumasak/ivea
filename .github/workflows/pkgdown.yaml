name: pkgdown

# Builds the pkgdown documentation site (_pkgdown.yml) and, on pushes to main,
# publishes it to GitHub Pages. The site includes the reference index plus the
# K562 chr22 tutorial at vignettes/articles/ivea-k562.Rmd, which pkgdown renders
# LIVE from the source tree: it runs the real variational-Bayes inference against
# the committed example/output/ fixtures and reference/ files. Those live outside
# the package tarball (they are .Rbuildignore'd), so the site must be built from
# the checked-out source, not an installed tarball — which pkgdown does.
#
# This is an R-only build (library(IVEA) + library(ggplot2)); unlike pipeline.yml
# it needs none of the Python/MACS3/samtools stack, so it uses the same
# r-lib/actions + public RSPM toolchain as r-check.yml rather than the conda env.
# `local::.` installs IVEA so the article can load it; `needs: website` pulls the
# Suggests pkgdown requires (knitr, rmarkdown, ggplot2).
#
# NOTE: publishing requires GitHub Pages to be enabled for the repository
# (Settings -> Pages -> Deploy from the gh-pages branch) — a one-time maintainer
# action. Until then the build still runs and validates the site on every push/PR.

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# Only restrict concurrency for non-PR jobs (PRs just build, they do not deploy).
concurrency:
  group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
  cancel-in-progress: true

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # the tutorial article runs the chr22 inference live (~2 min)
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write   # the deploy step pushes the built site to the gh-pages branch
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
            local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub Pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.6.9
        with:
          clean: false
          branch: gh-pages
          folder: docs
